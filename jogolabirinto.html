<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Labirinto do Computador</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800&family=Fredoka+One&display=swap" rel="stylesheet">
</head>
<body>
  <div id="stars"></div>
  
  <div id="container">
    <h1>🧠 Labirinto do Computador</h1>
    <div id="game">
      <canvas id="canvas" width="900" height="600"></canvas>
      
      <div id="ui">
        <div id="challengeMenu" class="card">
          <h3>🎯 Dificuldade</h3>
          <button class="btn-diff easy" onclick="startGame('Fácil')">Fácil</button>
          <button class="btn-diff medium" onclick="startGame('Médio')">Médio</button>
          <button class="btn-diff hard" onclick="startGame('Difícil')">Difícil</button>
        </div>
        
        <div class="card card--progress">
          <h2 id="diffLabel">Modo: -</h2>
          <p id="fase">Fase: -</p>
          <div id="scoreBox">⭐ Pontos: <span id="score">0</span></div>
          <div class="best-score">🏆 Recorde: <span id="bestScore">0</span></div>
        </div>
      </div>
    </div>
  </div>

  <div id="quizModal" class="modal">
    <div class="modal-content">
      <h2 id="quizTitle">🧩 Desafio</h2>
      <div id="quizQuestion" style="margin:20px 0; font-weight:800;"></div>
      <div id="quizOptions"></div>
      <div id="quizFeedback" style="display:none; padding:10px; border-radius:10px; margin-top:10px;"></div>
      <button id="quizSubmit" class="btn-quiz" onclick="validateAnswer()" disabled>✅ Responder!</button>
    </div>
  </div>

  <div id="victoryModal" class="modal">
    <div class="modal-content" style="border-color: #FFD700;">
      <h1 style="font-size: 3rem; margin: 10px 0;">🏆</h1>
      <h2 style="color: #FFD700; font-family: 'Fredoka One', cursive;">Labirinto Concluído!</h2>
      <p style="font-size: 1.2rem;">Você provou que domina o Hardware.</p>
      
      <div style="background: #f0f0f0; padding: 15px; border-radius: 15px; margin: 20px 0;">
        <h3 style="margin: 0; color: #7209B7;">Sua Pontuação Final:</h3>
        <span id="finalScore" style="font-size: 2.5rem; font-weight: 900; color: #4CC9F0;">0</span>
      </div>

      <button class="btn-quiz" onclick="returnToMenu()" style="background: #FFD700; color: #333;">
        🎮 Jogar Novamente
      </button>
    </div>
  </div>

  <script src="assets/js/script.js"></script>
</body>
</html>
